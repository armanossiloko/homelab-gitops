# Public hostnames served by the tunnel. To publish another service:
#   1. add a rule here (above the final catch-all),
#   2. add a proxied CNAME <name> → 6906d45f-8bd1-4cd0-aeea-0627e0013cb1.cfargotunnel.com
#      in Cloudflare DNS,
#   3. commit and push; sync restarts the tunnel with the new rules.
# https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/configure-tunnels/local-management/configuration-file/
tunnel: 6906d45f-8bd1-4cd0-aeea-0627e0013cb1

ingress:
  - hostname: immich.fakegamedevelopers.com
    service: http://localhost:10002

  # Anything else that reaches the tunnel gets a 404.
  - service: http_status:404
