# Dashboard tiles. https://gethomepage.dev/configs/services/
#
# Each tile shows its container's state (`server` + `container`, from the
# Podman socket; click it for CPU/RAM) and, where there's a `siteMonitor`, an
# HTTP check with response time. Checks run from the dashboard container on
# host networking, so localhost:<port> is the app's published port.
#
# {{HOMEPAGE_VAR_HOST}} and {{HOMEPAGE_VAR_DOMAIN}} are filled in from .env,
# which the pre-up hook writes (LAN address and HOMELAB_DOMAIN).
#
# When you add a stack, add its tile here too.

- Apps:
    - Jellyfin:
        icon: jellyfin.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:10001
        description: Movies, shows, cartoons and wrestling
        server: podman
        container: jellyfin
        siteMonitor: http://localhost:10001/health

    - Immich:
        icon: immich.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:10002
        description: Photos and videos · immich.{{HOMEPAGE_VAR_DOMAIN}}
        server: podman
        container: immich_server
        siteMonitor: http://localhost:10002/api/server/ping

    - FUTO Notes:
        icon: mdi-notebook-outline
        href: http://{{HOMEPAGE_VAR_HOST}}:10003
        description: Notes sync server · futo-notes.{{HOMEPAGE_VAR_DOMAIN}}
        server: podman
        container: futo-notes
        siteMonitor: http://localhost:10003/health

    - OpenCloud:
        icon: open-cloud.svg
        href: https://files.{{HOMEPAGE_VAR_DOMAIN}}
        description: Files and sharing · files.{{HOMEPAGE_VAR_DOMAIN}}
        server: podman
        container: opencloud
        siteMonitor: http://localhost:10007/status.php

    - n8n:
        icon: n8n.svg
        href: http://{{HOMEPAGE_VAR_HOST}}:10006
        description: Workflow automation
        server: podman
        container: n8n
        siteMonitor: http://localhost:10006/healthz/readiness

    - Portainer:
        icon: portainer.svg
        href: https://{{HOMEPAGE_VAR_HOST}}:10000
        description: Containers on the Podman engine
        server: podman
        container: portainer
        siteMonitor: https://localhost:10000/api/system/status

    - Printing:
        icon: mdi-printer
        href: http://{{HOMEPAGE_VAR_HOST}}:631/printers/
        description: Print from any device · Save as PDF and USB printers
        siteMonitor: http://localhost:631/

- Behind the scenes:
    - Cloudflare Tunnel:
        icon: cloudflare.svg
        description: Public access; checks Immich through the tunnel
        server: podman
        container: cloudflared
        siteMonitor: https://immich.{{HOMEPAGE_VAR_DOMAIN}}/api/server/ping

    - Immich database:
        icon: postgres.svg
        description: Postgres with vector search
        server: podman
        container: immich_postgres

    - Immich machine learning:
        icon: mdi-brain
        description: Face recognition and smart search
        server: podman
        container: immich_machine_learning

    - Immich cache:
        icon: redis.svg
        description: Valkey job queue
        server: podman
        container: immich_redis

    - n8n task runners:
        icon: mdi-code-braces
        description: Runs the JavaScript and Python in Code nodes
        server: podman
        container: n8n-runners
