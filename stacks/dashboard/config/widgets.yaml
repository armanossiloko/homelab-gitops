# Top bar: host health. https://gethomepage.dev/widgets/info/resources/
# `/` is the OS drive; /mnt/media is HOMELAB_MEDIA (the media SSD), mounted
# read-only in compose.yml just so its free space can be shown.
- resources:
    label: System
    cpu: true
    memory: true
    uptime: true
    cputemp: true
    units: metric

- resources:
    label: OS drive
    disk: /

- resources:
    label: Media SSD
    disk: /mnt/media

- datetime:
    text_size: md
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
