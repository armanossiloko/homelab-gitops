# Shared homelab settings (tracked in git). Override per machine in .homelab.env
# (gitignored), or pass on first run: HOMELAB_MEDIA=/srv/media ./bootstrap.sh

# App state: databases, configs, caches (one subfolder per stack)
HOMELAB_DATA=$HOME/homelab-data

# Media root on the dedicated SSD (/mnt/media/modulab, bind-mounted at /modulab).
# Containers see its subfolders as /media/<name>:
#   movies, shows, cartoons → Jellyfin    images → Immich photo library
HOMELAB_MEDIA=/modulab/media

# How often the sync timer checks git for new commits (systemd time span)
HOMELAB_SYNC_INTERVAL=5min

# Host port range for web UIs (see README). bootstrap opens it in ufw for the
# local subnet only.
HOMELAB_PORTS=10000:10099

# Public URLs of services exposed through the Cloudflare tunnel
# (stacks/cloudflared/config.yml). Immich uses it for share links.
IMMICH_PUBLIC_URL=https://immich.old-domain.example
