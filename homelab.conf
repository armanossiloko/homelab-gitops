# Shared homelab settings (tracked in git). Override per machine in .homelab.env
# (gitignored), or pass on first run: HOMELAB_MEDIA=/srv/media ./bootstrap.sh

# App state: databases, configs, caches (one subfolder per stack)
HOMELAB_DATA=$HOME/homelab-data

# Media root on the dedicated SSD (/mnt/media/modulab, bind-mounted at /modulab).
# Containers see its subfolders as /media/<name>:
#   movies, shows, cartoons, wrestling → Jellyfin    images → Immich photo library
HOMELAB_MEDIA=/modulab/media

# How often the sync timer checks git for new commits (systemd time span)
HOMELAB_SYNC_INTERVAL=5min

# Host port range for web UIs (see README). bootstrap opens it in ufw for the
# local subnet only.
HOMELAB_PORTS=10000:10099

# Public domain for services exposed through the Cloudflare tunnel
# (immich.<domain>, files.<domain>, ...). This repo is public, so the domain is
# NOT set here: put HOMELAB_DOMAIN=<your domain> in .homelab.env (gitignored),
# or pass it on first run: HOMELAB_DOMAIN=example.com ./bootstrap.sh
# The tunnel config is rendered from stacks/cloudflared/config.template.yml
# with it ({{DOMAIN}}). Changing it also needs DNS records in the new zone
# (README). Immich's external domain (share links) follows it as
# https://immich.<domain>; override with IMMICH_PUBLIC_URL in .homelab.env.
